# Render Blueprint for the GTA V web port host.
# Deploy with: Render Dashboard -> New -> Blueprint -> point at this repo.
services:
  - type: web
    name: freeplay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /__status
    envVars:
      - key: GTA5_CACHE_LIMIT
        value: "268435456"
      - key: NODE_VERSION
        value: "20"
      - key: GTA5_DOWNLOAD_URL
        value: "https://archive.org/download/playgta5-offline/playgta5-offline.zip"
